<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petal Bloom</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9ec; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 18px; left: 20px; right: 20px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none; color: #5a2a4a;
    font-size: 26px; font-weight: 700; letter-spacing: 0.02em;
    text-shadow: 0 1px 3px rgba(255,255,255,0.8);
  }
  #hudCount { background: rgba(255,255,255,0.55); border-radius: 14px; padding: 6px 16px; }
  #sizeRingFg { transition: stroke-dashoffset 0.3s ease; }

  /* Title card overlay */
  #title {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: rgba(255, 227, 240, 0.92); color: #5a2a4a;
    text-align: center;
  }
  #title h1 { font-size: 64px; margin: 0; letter-spacing: 0.02em; }
  #title p { font-size: 24px; margin: 0; max-width: 640px; line-height: 1.5; }
  #title .btnrow { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .bigbtn {
    font-size: 30px; font-weight: 700; color: #5a2a4a; cursor: pointer;
    background: #fff; border: 4px solid #5a2a4a; border-radius: 18px;
    padding: 18px 44px; min-width: 220px;
  }
  	  .bigbtn:focus-visible { outline: 5px solid #ff9ec0; }
	  .ambient-toggle {
	    font-size: 22px; color: #5a2a4a; cursor: pointer; user-select: none;
	    display: inline-flex; align-items: center; gap: 10px;
	  }
	  .ambient-toggle input { width: 26px; height: 26px; accent-color: #ff9ec0; cursor: pointer; }
	  .tinyhint { font-size: 15px; opacity: 0.7; }
  .bigbtn.grow { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  #confirm {
    position: fixed; inset: 0; z-index: 25; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(90,42,74,0.55); color: #fff;
    text-align: center;
  }
  #confirm.show { display: flex; }
  #confirm h2 { font-size: 36px; margin: 0; }
  #confirm .btnrow { display: flex; gap: 20px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <span id="hudCount">0 / 0</span>
  <svg id="sizeRing" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="18" fill="none" stroke="#5a2a4a" stroke-opacity="0.25" stroke-width="5"/>
    <circle id="sizeRingFg" cx="22" cy="22" r="18" fill="none" stroke="#ff9ec0" stroke-width="5"
      stroke-linecap="round" transform="rotate(-90 22 22)" stroke-dasharray="113.1" stroke-dashoffset="113.1"/>
  </svg>
</div>

<div id="title">
  <h1>🌸 Petal Bloom</h1>
  <p>Hold <strong>LEFT</strong> or <strong>RIGHT</strong> to steer.<br>
     Follow the glowing trail. Collect the buds. Grow big. Forever.</p>
  	  <div class="btnrow">
	    <button id="btnStart" class="bigbtn grow" type="button">Start</button>
	    <button id="btnReset" class="bigbtn" type="button">Reset progress</button>
	  </div>
	  <label class="ambient-toggle" for="ambientOn">
	    <input type="checkbox" id="ambientOn" checked> Ambient music <span class="keyhint">(M)</span>
	  </label>
	</div>

<div id="confirm" role="alertdialog" aria-modal="true">
  <h2>Reset all progress?</h2>
  <p>Your petal will return to its starting size. This cannot be undone.</p>
  <div class="btnrow">
    <button id="btnCancelReset" class="bigbtn" type="button">Cancel</button>
    <button id="btnDoReset" class="bigbtn" type="button">Yes, reset everything</button>
  </div>
</div>

<script type="module" src="./src/main.js?v=7"></script>
</body>
</html>
