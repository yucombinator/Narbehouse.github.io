<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bloom has moved</title>
  <!-- Petal Bloom was renamed to bloom/ — send every old bookmark there.
       location.replace keeps the back button clean; meta refresh is the
       no-JS fallback. -->
  <meta http-equiv="refresh" content="0; url=../bloom/">
  <script>
    location.replace('../bloom/' + location.search + location.hash);
  </script>
  <style>
    body { font-family: system-ui, sans-serif; background: #ffe7f3; color: #5a2a4a;
           display: grid; place-items: center; min-height: 90vh; }
    a { color: #d4568f; }
  </style>
</head>
<body>
  <p>This meadow moved — flying you to <a href="../bloom/">/bloom/</a>…</p>
</body>
</html>
