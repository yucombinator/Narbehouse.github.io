<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petal Bloom</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9ec; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 18px; left: 20px; right: 20px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none; color: #5a2a4a;
    font-size: 26px; font-weight: 700; letter-spacing: 0.02em;
    text-shadow: 0 1px 3px rgba(255,255,255,0.8);
  }
  #hudCount { background: rgba(255,255,255,0.55); border-radius: 14px; padding: 6px 16px; }
  #sizeRingFg { transition: stroke-dashoffset 0.3s ease; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <span id="hudCount">0 / 0</span>
  <svg id="sizeRing" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="18" fill="none" stroke="#5a2a4a" stroke-opacity="0.25" stroke-width="5"/>
    <circle id="sizeRingFg" cx="22" cy="22" r="18" fill="none" stroke="#ff9ec0" stroke-width="5"
      stroke-linecap="round" transform="rotate(-90 22 22)" stroke-dasharray="113.1" stroke-dashoffset="113.1"/>
  </svg>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
